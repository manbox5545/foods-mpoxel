<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Page Not Found | Mpoxel Foods</title>
  <style>
    :root { color-scheme: light; --ink:#172033; --muted:#667085; --accent:#111827; --line:#e7eaf0; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:#f7f8fb; color:var(--ink); font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(100%,520px); padding:clamp(28px,6vw,48px); text-align:center; background:#fff; border:1px solid var(--line); border-radius:24px; box-shadow:0 18px 55px rgba(20,30,50,.07); }
    .code { display:inline-flex; align-items:center; justify-content:center; min-width:76px; height:38px; padding:0 14px; border-radius:999px; background:#f0f2f5; color:#475467; font-size:13px; font-weight:800; letter-spacing:.12em; }
    h1 { margin:22px 0 12px; font-size:clamp(27px,6vw,38px); line-height:1.15; letter-spacing:-.04em; }
    p { margin:0 auto; max-width:360px; color:var(--muted); font-size:16px; line-height:1.7; }
    a { display:inline-flex; justify-content:center; align-items:center; min-height:50px; margin-top:28px; padding:0 24px; border-radius:12px; background:var(--accent); color:#fff; text-decoration:none; font-weight:750; transition:transform .15s ease,background .15s ease; }
    a:hover { background:#30394a; transform:translateY(-1px); }
    a:focus-visible { outline:3px solid #98a2b3; outline-offset:4px; }
    .brand { margin-top:24px; font-size:12px; color:#98a2b3; letter-spacing:.08em; text-transform:uppercase; }
  </style>
<style>

/* Mpoxel Foods theme-matched text selection */
::selection {
  background: rgba(205, 166, 92, 0.38);
  color: #172033;
  text-shadow: 0 2px 10px rgba(205, 166, 92, 0.18);
}
::-moz-selection {
  background: rgba(205, 166, 92, 0.38);
  color: #172033;
  text-shadow: 0 2px 10px rgba(205, 166, 92, 0.18);
}
/* Selected text gets a subtle floating highlight for as long as it remains selected. */
html {
  --mpoxel-selection-glow: 0 3px 12px rgba(205, 166, 92, 0.16);
}

</style>
</head>
<body>
  <main>
    <div class="code">ERROR 404</div>
    <h1>Sorry, this URL doesn’t belong to us.</h1>
    <p>The page you’re looking for doesn’t exist or may have moved. You can instead go to our main website.</p>
    <a href="https://food.mpoxel.in/">GO TO RIGHT URL</a>
    <div class="brand">MPOXEL FOODS</div>
  </main>
</body>
</html>
